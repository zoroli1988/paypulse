name: Release

# 发布流水线：打 tag（v0.1.0 这种）时触发。
#
# 流程：
# 1. 拉私有引擎（submodule，用 PAYPULSE_CORE_PAT）
# 2. 编译各平台安装包（Windows NSIS + macOS app）
# 3. 用 UPDATE_SIGNING_KEY（Ed25519 私钥 hex，GitHub secret）给每个包签名
# 4. 生成 manifest.json 并随安装包一起上传到 GitHub Releases
#
# 私钥只以 secret 形式出现，绝不出现在仓库/日志里。公钥已硬编码在
# update.rs 的 UPDATE_PUBKEY_HEX。

on:
  push:
    tags:
      - 'v*'

# GITHUB_TOKEN 默认只读，创建/上传 Release 需要显式给 contents 写权限。
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------
  # Windows 安装包
  # ------------------------------------------------------------------
  windows:
    name: Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAYPULSE_CORE_PAT }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装前端依赖
        run: cd app && npm install

      - name: 编译安装包（NSIS）
        shell: bash
        run: cd app && npx tauri build

      - name: 上传安装包到 Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------
  # macOS 安装包（x86_64 + aarch64 通用，或分开）
  # ------------------------------------------------------------------
  macos:
    name: macOS 安装包
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAYPULSE_CORE_PAT }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装前端依赖
        run: cd app && npm install

      - name: 编译安装包（app + dmg）
        run: cd app && npx tauri build

      - name: 上传安装包到 Releases
        uses: softprops/action-gh-release@v2
        with:
          # 只传 dmg。`bundle/macos/*.app.tar.gz` 只有开了
          # `bundle.createUpdaterArtifacts` 才会生成——本工程的更新是
          # 「下载安装包、用户自己装」，不做原地替换，所以那个 glob 一直是空匹配
          # （v0.1.4 的 Release 里就没有它）。
          files: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------
  # 生成 manifest.json（签名）+ 发布
  # 依赖 Windows/macOS 编译完成，拿到 sha256 后签名。
  # 两个平台各一个包项：Windows 是 NSIS 安装器，macOS 是 dmg。
  # ------------------------------------------------------------------
  manifest:
    name: 生成 manifest 并发布
    runs-on: ubuntu-latest
    needs: [windows, macos]
    env:
      UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: 下载刚发布的安装包
        # 用 gh 而不是第三方 downloader：`--pattern` 能重复给，一次拉两种包，
        # 也不用猜多个 glob 在某个 action 里的匹配语义。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/pkg"
          # 精确取当前 tag，不能用 latest：latest 可能还指向上一个 tag，
          # 会拿到旧包，导致 manifest 指向错误的安装包。
          gh release download "$GITHUB_REF_NAME" \
            --pattern '*.exe' --pattern '*.dmg' \
            --dir "$GITHUB_WORKSPACE/pkg"
          ls -la "$GITHUB_WORKSPACE/pkg"

      - name: 生成 manifest.json
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_DIR="$GITHUB_WORKSPACE/pkg"

          # 每个平台一个 key，**架构从文件名里认**。
          # 写死 arm64 的话，哪天 macos-latest 换成 Intel 镜像，就会给出一个
          # 装不上的包——而且签名是对的、客户端验得过，用户下载完才发现装不了。
          PKG_ARGS=()
          PKG_NAMES=()
          add_pkg() { # $1=key  $2=文件
            PKG_ARGS+=(--pkg "$1" "$2")
            PKG_NAMES+=("$1=$(basename "$2")")
            echo "  + $1  $(basename "$2")"
          }

          # Windows：优先 NSIS 的 setup.exe（MSI 要管理员权限，也不适合就地升级）
          EXE=$(ls "$PKG_DIR"/*_"$VERSION"_*setup.exe 2>/dev/null | head -1 || true)
          if [ -z "$EXE" ]; then
            EXE=$(ls "$PKG_DIR"/*_"$VERSION"_*.exe 2>/dev/null | head -1 || true)
          fi
          if [ -z "$EXE" ]; then
            echo "找不到 ${VERSION} 的 exe，目录内容："
            ls -la "$PKG_DIR"
            exit 1
          fi
          add_pkg windows-x64 "$EXE"

          # macOS：出的是 dmg。dmg 不能就地替换（要挂载再拖），所以 mac 上的
          # 「安装」和 Windows 一样是用户自己跑一次安装包——两边语义一致。
          DMG=$(ls "$PKG_DIR"/*_"$VERSION"_*.dmg 2>/dev/null | head -1 || true)
          if [ -n "$DMG" ]; then
            case "$(basename "$DMG")" in
              *_aarch64.dmg | *_arm64.dmg) add_pkg darwin-arm64 "$DMG" ;;
              *_x64.dmg | *_x86_64.dmg)    add_pkg darwin-x64   "$DMG" ;;
              *)
                echo "::warning::dmg 文件名里认不出架构，先不写进 manifest：$(basename "$DMG")"
                ;;
            esac
          else
            echo "::warning::没找到 dmg，这次 manifest 不含 macOS 包（mac 用户会看到「这一版还没有提供 darwin-arm64 的安装包」）"
          fi

          cd app/tools/make-manifest
          cargo run --release -- \
            --version "$VERSION" \
            --channel stable \
            --priv "$UPDATE_SIGNING_KEY" \
            "${PKG_ARGS[@]}" \
            --out manifest.json

          # make-manifest 把 url 写成传进去的本地路径，这里换成真实下载地址。
          # 每个包指向自己的文件——之前是所有包都指向 exe，加上第二个包之后
          # 那样写会让 mac 用户下到一个 exe 安装器。
          python3 - "$VERSION" "${PKG_NAMES[@]}" <<'PY'
          import json, os, sys

          ver = sys.argv[1]
          names = dict(a.split("=", 1) for a in sys.argv[2:])
          with open("manifest.json", encoding="utf-8") as f:
              m = json.load(f)
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/v{ver}"
          for key, pkg in m["packages"].items():
              if key not in names:
                  raise SystemExit(f"manifest 里有 {key}，但没给它配文件名")
              pkg["url"] = f"{base}/{names[key]}"
              print("  " + key + " -> " + pkg["url"])
          with open("manifest.json", "w", encoding="utf-8") as f:
              json.dump(m, f, ensure_ascii=False, indent=2)
          PY
          echo "manifest 已生成"

      - name: 上传 manifest 到 Releases
        uses: softprops/action-gh-release@v2
        with:
          files: app/tools/make-manifest/manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
