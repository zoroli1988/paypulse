name: Release

# 发布流水线：打 tag（v0.1.0 这种）时触发。
#
# 流程：
# 1. 拉私有引擎（submodule，用 PAYPULSE_CORE_PAT）
# 2. 编译各平台安装包（Windows NSIS + macOS app）
# 3. 用 UPDATE_SIGNING_KEY（Ed25519 私钥 hex，GitHub secret）给每个包签名
# 4. 生成 manifest.json 并随安装包一起上传到 GitHub Releases
#
# 私钥只以 secret 形式出现，绝不出现在仓库/日志里。公钥已硬编码在
# update.rs 的 UPDATE_PUBKEY_HEX。

on:
  push:
    tags:
      - 'v*'

# GITHUB_TOKEN 默认只读，创建/上传 Release 需要显式给 contents 写权限。
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------
  # Windows 安装包
  # ------------------------------------------------------------------
  windows:
    name: Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAYPULSE_CORE_PAT }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装前端依赖
        run: cd app && npm install

      - name: 编译安装包（NSIS）
        shell: bash
        run: cd app && npx tauri build

      - name: 上传安装包到 Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------
  # macOS 安装包（x86_64 + aarch64 通用，或分开）
  # ------------------------------------------------------------------
  macos:
    name: macOS 安装包
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAYPULSE_CORE_PAT }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装前端依赖
        run: cd app && npm install

      - name: 编译安装包（app + dmg）
        run: cd app && npx tauri build

      - name: 上传安装包到 Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/macos/*.app.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------
  # 生成 manifest.json（签名）+ 发布
  # 依赖 Windows/macOS 编译完成，拿到 sha256 后签名。
  # 这一版先做「Windows-only」的 manifest（mac 版尚未真机验证），
  # 等 mac 版稳定后再把 darwin 包并进来。
  # ------------------------------------------------------------------
  manifest:
    name: 生成 manifest 并发布
    runs-on: ubuntu-latest
    needs: [windows, macos]
    env:
      UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: 下载刚发布的安装包
        uses: robinraju/release-downloader@v1.9
        with:
          # 精确下载当前 tag，不能用 latest：latest 可能还指向上一个 tag（v0.1.0），
          # 会拿到旧版的 exe 导致 manifest 指向错误的安装包。
          tag: ${{ github.ref_name }}
          fileName: "*.exe"
          tarBall: false
          zipBall: false

      - name: 生成 manifest.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # 精确取当前版本号的 exe（release 里可能混入旧 tag 的产物），
          # 用文件名里带 "_${VERSION}_" 来锁定，避免拿到旧版。
          EXE=$(ls "$GITHUB_WORKSPACE"/*_${VERSION}_*setup.exe 2>/dev/null | head -1)
          if [ -z "$EXE" ]; then
            EXE=$(ls "$GITHUB_WORKSPACE"/*_${VERSION}_*.exe 2>/dev/null | head -1)
          fi
          if [ -z "$EXE" ]; then
            echo "找不到 ${VERSION} 的 exe，当前目录内容："; ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi
          echo "使用安装包：$EXE"
          cd app/tools/make-manifest
          cargo run --release -- \
            --version "$VERSION" \
            --channel stable \
            --priv "$UPDATE_SIGNING_KEY" \
            --pkg windows-x64 "$EXE" \
            --out manifest.json
          # make-manifest 把 url 写成本地路径，这里替换成真实 Release 下载地址
          python3 - "$VERSION" "$EXE" <<'PY'
          import json, sys, os
          ver = sys.argv[1]
          exe = os.path.basename(sys.argv[2])
          with open("manifest.json", encoding="utf-8") as f:
              m = json.load(f)
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/v{ver}"
          for pkg in m.get("packages", {}).values():
              pkg["url"] = f"{base}/{exe}"
          with open("manifest.json", "w", encoding="utf-8") as f:
              json.dump(m, f, ensure_ascii=False, indent=2)
          print("manifest url 已替换为:", base + "/" + exe)
          PY
          echo "manifest 已生成"

      - name: 上传 manifest 到 Releases
        uses: softprops/action-gh-release@v2
        with:
          files: app/tools/make-manifest/manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
