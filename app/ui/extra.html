<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>记一笔</title>
<style>
/* ---- 一扇「插一句就走」的小窗，340 × 196 ----
   原型稿里没有这扇窗。它按现有视觉语言补：深色玻璃、18 圆角、
   绿色主按钮、等宽数字，和悬浮窗同一套变量。
   主题跟应用走（打开时问一次 get_settings），不自己猜系统。*/

:root {
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  --accent: #35E07F;
  --accent-ink: #05230F;       /* 绿底上的字，两种主题都用这个深色 */
  --bg: rgba(17, 19, 24, .97);
  --fg: #fff;
  --fg-rgb: 255, 255, 255;
  --muted: rgba(255, 255, 255, .45);
  --line: rgba(255, 255, 255, .1);
  --field: rgba(255, 255, 255, .06);
  --err: #FF6B6B;
}

/* 浅色档：只换变量，不改规则——改规则一定会漏一条，
   而漏掉的那条在浅色下要么看不见，要么变成一块黑斑。 */
:root[data-theme="light"] {
  --bg: rgba(250, 250, 252, .98);
  --fg: #14161B;
  --fg-rgb: 20, 22, 27;
  --muted: rgba(20, 22, 27, .48);
  --line: rgba(0, 0, 0, .12);
  --field: rgba(0, 0, 0, .05);
  --err: #C0392B;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
  font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--fg);
  -webkit-user-select: none;
  user-select: none;
  cursor: default;
}

.card {
  width: 340px;
  height: 196px;
  padding: 16px 18px 14px;
  border-radius: 18px;
  background: var(--bg);
  border: 1px solid var(--line);
  box-shadow:
    0 30px 64px -18px rgba(0, 0, 0, .75),
    0 0 0 .5px rgba(0, 0, 0, .5),
    inset 0 1px 0 rgba(var(--fg-rgb), .06);
  display: flex;
  flex-direction: column;
}

.head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}
.head b {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: .2px;
}
.head span {
  font-size: 10px;
  color: var(--muted);
  font-family: var(--mono);
  letter-spacing: .5px;
}

.note {
  margin-top: 3px;
  font-size: 10.5px;
  color: var(--muted);
  letter-spacing: .2px;
}

.field {
  margin-top: 13px;
  display: flex;
  align-items: center;
  gap: 8px;
  height: 46px;
  padding: 0 12px;
  border-radius: 12px;
  background: var(--field);
  border: 1px solid var(--line);
  transition: border-color .16s, box-shadow .16s;
}
.field:focus-within {
  border-color: rgba(53, 224, 127, .55);
  box-shadow: 0 0 0 3px rgba(53, 224, 127, .12);
}
.field i {
  font-style: normal;
  font-size: 17px;
  color: var(--muted);
  font-family: var(--mono);
}
.field input {
  flex: 1;
  min-width: 0;
  background: none;
  border: 0;
  outline: 0;
  color: var(--fg);
  font-family: var(--mono);
  font-size: 24px;
  font-weight: 600;
  letter-spacing: .5px;
  -webkit-user-select: text;
  user-select: text;
}
.field input::placeholder {
  color: var(--muted);
  font-weight: 400;
  font-size: 18px;
}

.msg {
  height: 15px;
  margin-top: 6px;
  font-size: 10.5px;
  letter-spacing: .2px;
  color: var(--muted);
}
.msg.bad { color: var(--err); }
.msg.ok { color: var(--accent); }

.foot {
  margin-top: auto;
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}
button {
  height: 30px;
  padding: 0 14px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--field);
  color: var(--fg);
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  transition: background .14s, border-color .14s, opacity .14s;
}
button:hover { border-color: rgba(var(--fg-rgb), .22); }
button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  font-weight: 600;
}
button.primary:hover { filter: brightness(1.06); }
button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <b>记一笔</b>
      <span>Esc 取消</span>
    </div>
    <div class="note">进本月总账，不进日薪与小时单价</div>

    <div class="field">
      <i>¥</i>
      <input id="amt" type="text" inputmode="decimal" autocomplete="off"
             spellcheck="false" placeholder="0.00" />
    </div>
    <div class="msg" id="msg">回车记下</div>

    <div class="foot">
      <button id="cancel">取消</button>
      <button class="primary" id="ok">记下</button>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var invoke = window.__TAURI__ && window.__TAURI__.core
    ? window.__TAURI__.core.invoke
    : null;

  /* 见 settings.js 顶上那段：这扇窗也不要网页右键菜单。 */
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); }, true);

  var amt = document.getElementById("amt");
  var msg = document.getElementById("msg");
  var okBtn = document.getElementById("ok");
  var cancelBtn = document.getElementById("cancel");

  var busy = false;

  function say(text, kind) {
    msg.textContent = text;
    msg.className = "msg" + (kind ? " " + kind : "");
  }

  /* 主题跟应用走。取一次就够——这扇窗活得比设置窗短。
     取不到（比如刚启动、命令还没就绪）就按深色，和悬浮窗的默认一致。 */
  function paintTheme() {
    if (!invoke) return;
    invoke("get_settings").then(function (v) {
      var t = v && v.theme;
      if (t === "system") {
        var mq = window.matchMedia("(prefers-color-scheme: light)");
        t = mq && mq.matches ? "light" : "dark";
      }
      document.documentElement.setAttribute(
        "data-theme", t === "light" ? "light" : "dark"
      );
    }).catch(function () {});
  }

  function reset() {
    amt.value = "";
    amt.focus();
    say("回车记下");
  }

  function submit() {
    if (busy) return;
    var text = amt.value.trim();
    if (!text) {
      say("先填个金额", "bad");
      amt.focus();
      return;
    }
    busy = true;
    okBtn.disabled = true;
    /* 金额原样交给 Rust 解析：这里的任何一个乘法都会在 12.34 上少一毫。 */
    invoke("add_extra", { amountText: text })
      .then(function (shown) {
        busy = false;
        okBtn.disabled = false;
        amt.value = "";
        amt.focus();
        /* shown 是 Rust 格式化好的 `¥300.00`，这里只是把它念出来 */
        say("已记 " + shown, "ok");
      })
      .catch(function (e) {
        busy = false;
        okBtn.disabled = false;
        say(String(e && e.message ? e.message : e), "bad");
        amt.focus();
      });
  }

  function close() {
    if (!invoke) return window.close();
    invoke("close_extra");
    /* 关掉之后清空，下次按快捷键是一张干净的卡 */
    reset();
  }

  okBtn.addEventListener("click", submit);
  cancelBtn.addEventListener("click", close);

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      e.preventDefault();
      close();
    } else if (e.key === "Enter") {
      e.preventDefault();
      submit();
    }
  });

  /* 每次重新显示都从空开始：窗只是 hide 不是关，
     WebView 还活着，不清就会留着上一笔的金额。 */
  window.addEventListener("focus", reset);

  paintTheme();
  reset();
})();
</script>
</body>
</html>
