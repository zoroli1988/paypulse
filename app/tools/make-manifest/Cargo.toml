[package]
name = "make-manifest"
version = "0.1.0"
edition = "2021"
description = "发版机工具：给安装包算 sha256 + Ed25519 签名，生成 update 的 manifest.json。"

[[bin]]
name = "make-manifest"
path = "src/main.rs"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
